<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="80%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#4facfe"/>
      <stop offset="75%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="50%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2744" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0c162d" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#38ef7d;#00f2fe;#ffffff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#ffffff;#38ef7d;#00f2fe" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#ffffff;#4facfe" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-bright" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neural Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2e4a" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>

    <!-- Clip Path for Banner Rounded Corners -->
    <clipPath id="bannerClip">
      <rect width="1200" height="420" rx="16" ry="16"/>
    </clipPath>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 2px;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
        font-size: 15px;
      }
      .badge-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
        font-weight: 600;
      }
      .code-font {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }

      /* Animations */
      @keyframes ecgPulse {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatMed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3.5px; opacity: 0.6; }
        50% { r: 6px; opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
      }
      @keyframes beamScan {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes heartBeat {
        0% { transform: scale(1); }
        14% { transform: scale(1.15); }
        28% { transform: scale(1); }
        42% { transform: scale(1.15); }
        70% { transform: scale(1); }
      }

      .animated-ecg {
        stroke-dasharray: 2000;
        animation: ecgPulse 6s linear infinite;
      }
      .floating-item-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-item-2 { animation: floatMed 6s ease-in-out infinite 1s; }
      .floating-item-3 { animation: floatSlow 7s ease-in-out infinite 2s; }
      .heart-pulse { transform-origin: 1060px 85px; animation: heartBeat 2.5s ease-in-out infinite; }
      .radar-arm { transform-origin: 1060px 85px; animation: radarSweep 10s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

    <!-- Grid Overlay -->
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- Ambient Glowing Orbs -->
    <circle cx="150" cy="100" r="220" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>
    <circle cx="1050" cy="200" r="280" fill="#4facfe" opacity="0.1" filter="url(#glow)"/>
    <circle cx="650" cy="380" r="200" fill="#11998e" opacity="0.08" filter="url(#glow)"/>
    <circle cx="950" cy="90" r="140" fill="#ff0844" opacity="0.08" filter="url(#glow)"/>

    <!-- Background Neural Synapse Lines -->
    <g stroke="#1a3560" stroke-width="1.2" opacity="0.6">
      <line x1="80" y1="60" x2="240" y2="120"/>
      <line x1="240" y1="120" x2="380" y2="70"/>
      <line x1="380" y1="70" x2="520" y2="130"/>
      <line x1="750" y1="80" x2="900" y2="140"/>
      <line x1="900" y1="140" x2="1060" y2="85"/>
      <line x1="1060" y1="85" x2="1140" y2="180"/>
      <line x1="880" y1="280" x2="1020" y2="350"/>
      <line x1="1020" y1="350" x2="1140" y2="300"/>
    </g>

    <!-- Animated Data Stream Particles -->
    <circle cx="80" cy="60" r="3" fill="#00f2fe" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="120" r="4" fill="#38ef7d" opacity="0.9" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="70" r="3" fill="#00f2fe" opacity="0.7"/>
    <circle cx="520" cy="130" r="3.5" fill="#4facfe" opacity="0.8"/>
    <circle cx="750" cy="80" r="3.5" fill="#00f2fe" opacity="0.7"/>
    <circle cx="900" cy="140" r="4" fill="#38ef7d" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="180" r="3" fill="#4facfe" opacity="0.8"/>
    <circle cx="880" cy="280" r="3.5" fill="#00f2fe" opacity="0.8"/>
    <circle cx="1020" cy="350" r="4" fill="#38ef7d" opacity="0.8"/>

    <!-- Dynamic Scanning Laser Beam -->
    <g>
      <rect x="0" y="0" width="120" height="420" fill="url(#lineGrad)" opacity="0.35" style="animation: beamScan 8s ease-in-out infinite;"/>
    </g>

    <!-- Medical AI Emblem / Cross / Neural Network (Top Right) -->
    <g transform="translate(1000, 45)" class="floating-item-1">
      <!-- Outer Hexagon Frame -->
      <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="#0b1733" stroke="#00f2fe" stroke-width="2" opacity="0.85" filter="url(#glow)"/>
      <polygon points="60,6 114,38 114,102 60,134 6,102 6,38" fill="none" stroke="#1e3a6a" stroke-width="1" stroke-dasharray="4,4"/>
      
      <!-- Medical Cross with AI Core -->
      <path d="M 50 38 L 70 38 L 70 58 L 90 58 L 90 78 L 70 78 L 70 98 L 50 98 L 50 78 L 30 78 L 30 58 L 50 58 Z" fill="url(#accentGrad)" opacity="0.9" filter="url(#glow)"/>

      <!-- Center Sparkle -->
      <circle cx="60" cy="68" r="5" fill="#ffffff" filter="url(#glow-bright)">
        <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Orbiting Electron / Agent Token -->
      <ellipse cx="60" cy="68" rx="42" ry="18" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="6,4" transform="rotate(30 60 68)" opacity="0.7"/>
      <circle cx="95" cy="80" r="3.5" fill="#00f2fe" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0 60 68" to="360 60 68" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Left Header Category Badge -->
    <g transform="translate(60, 48)">
      <rect width="250" height="30" rx="15" fill="#132247" stroke="#00f2fe" stroke-width="1.2" opacity="0.9"/>
      <!-- Glowing dot indicator -->
      <circle cx="16" cy="15" r="4.5" fill="#38ef7d" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="30" y="20" fill="#00f2fe" class="badge-text" letter-spacing="1.5">CLINICAL INTELLIGENCE</text>
      <text x="202" y="20" fill="#38ef7d" class="badge-text" font-weight="bold">v2026</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(60, 130)">
      <text class="title-text" fill="url(#textShimmer)" filter="url(#glow)">AWESOME MEDICAL CODING AI</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(60, 172)">
      <text class="subtitle-text" fill="#00f2fe" opacity="0.95">
        AUTONOMOUS CODING <tspan fill="#38ef7d">•</tspan> CLINICAL NLP <tspan fill="#38ef7d">•</tspan> REVENUE CYCLE INTELLIGENCE
      </text>
    </g>

    <!-- Brief Description / Tagline -->
    <g transform="translate(60, 204)">
      <text class="desc-text" fill="#a0b3d6">
        Curated stack of deep learning models, CAC platforms, EHR workflows, ontologies &amp; datasets.
      </text>
    </g>

    <!-- Floating Interactive Feature Badges -->
    <g transform="translate(60, 236)" class="floating-item-2">
      <!-- Badge 1: ICD-10 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="url(#cardGrad)" stroke="#2b477d" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#00f2fe" filter="url(#glow)"/>
        <text x="28" y="22" fill="#e2e8f0" class="badge-text">ICD-10-CM/PCS</text>
      </g>

      <!-- Badge 2: CPT & HCPCS -->
      <g transform="translate(150, 0)">
        <rect width="138" height="34" rx="8" fill="url(#cardGrad)" stroke="#2b477d" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#38ef7d" filter="url(#glow)"/>
        <text x="28" y="22" fill="#e2e8f0" class="badge-text">CPT® &amp; HCPCS</text>
      </g>

      <!-- Badge 3: SNOMED CT -->
      <g transform="translate(300, 0)">
        <rect width="130" height="34" rx="8" fill="url(#cardGrad)" stroke="#2b477d" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#4facfe" filter="url(#glow)"/>
        <text x="28" y="22" fill="#e2e8f0" class="badge-text">SNOMED CT</text>
      </g>

      <!-- Badge 4: Risk Adjustment HCC -->
      <g transform="translate(442, 0)">
        <rect width="168" height="34" rx="8" fill="url(#cardGrad)" stroke="#2b477d" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#ffd166" filter="url(#glow)"/>
        <text x="28" y="22" fill="#e2e8f0" class="badge-text">HCC Risk Adjustment</text>
      </g>

      <!-- Badge 5: FHIR / HL7 -->
      <g transform="translate(622, 0)">
        <rect width="126" height="34" rx="8" fill="url(#cardGrad)" stroke="#2b477d" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#ff0844" filter="url(#glow)"/>
        <text x="28" y="22" fill="#e2e8f0" class="badge-text">FHIR &amp; HL7</text>
      </g>

      <!-- Badge 6: Clinical LLMs -->
      <g transform="translate(760, 0)">
        <rect width="144" height="34" rx="8" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2"/>
        <circle cx="16" cy="17" r="4" fill="#00f2fe" filter="url(#glow)">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="28" y="22" fill="#00f2fe" class="badge-text" font-weight="bold">Clinical LLMs</text>
      </g>
    </g>

    <!-- Mini Live Coding Pipeline Flowchart (Right Area) -->
    <g transform="translate(930, 195)" class="floating-item-3" opacity="0.95">
      <rect width="210" height="85" rx="10" fill="#0c1836" stroke="#1f3a6e" stroke-width="1.4"/>
      
      <!-- Step 1: Clinical Notes -->
      <rect x="14" y="16" width="48" height="24" rx="4" fill="#182c58" stroke="#38ef7d" stroke-width="1"/>
      <text x="22" y="32" fill="#38ef7d" class="code-font" font-size="10" font-weight="bold">EHR</text>
      
      <!-- Arrow 1 -->
      <path d="M 68 28 L 78 28" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2,2"/>
      <polygon points="80,28 75,25 75,31" fill="#00f2fe"/>
      
      <!-- Step 2: NLP / LLM -->
      <rect x="84" y="16" width="46" height="24" rx="4" fill="#182c58" stroke="#00f2fe" stroke-width="1"/>
      <text x="92" y="32" fill="#00f2fe" class="code-font" font-size="10" font-weight="bold">AI</text>

      <!-- Arrow 2 -->
      <path d="M 136 28 L 146 28" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2,2"/>
      <polygon points="148,28 143,25 143,31" fill="#00f2fe"/>

      <!-- Step 3: Codes & QA -->
      <rect x="152" y="16" width="46" height="24" rx="4" fill="#182c58" stroke="#4facfe" stroke-width="1"/>
      <text x="159" y="32" fill="#4facfe" class="code-font" font-size="10" font-weight="bold">CAC</text>

      <!-- Status Line -->
      <circle cx="22" cy="62" r="3.5" fill="#38ef7d">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="66" fill="#8ea6cf" class="code-font" font-size="11">Accuracy: 98.4%</text>
      <text x="145" y="66" fill="#38ef7d" class="code-font" font-size="10" font-weight="bold">[HITL ✓]</text>
    </g>

    <!-- Bottom Animated ECG Vital & AI Neural Wave -->
    <g transform="translate(0, 310)">
      <!-- Faint Background Guide Line -->
      <line x1="0" y1="50" x2="1200" y2="50" stroke="#122347" stroke-width="1.5"/>

      <!-- Complex Vital Waveform: Flat -> P -> QRS -> T -> Flat -> High Frequency AI Signal -->
      <path d="M 0 50 
               L 120 50 
               L 135 44 L 145 50 
               L 160 50 
               L 168 56 L 176 10 L 186 68 L 194 50 
               L 215 50 
               L 230 38 L 245 50 
               L 340 50 
               L 355 44 L 365 50 
               L 380 50 
               L 388 56 L 396 6 L 406 72 L 414 50 
               L 435 50 
               L 450 38 L 465 50 
               L 560 50 
               C 600 20, 630 80, 670 50 
               C 710 20, 740 80, 780 50 
               L 840 50 
               L 855 44 L 865 50 
               L 880 50 
               L 888 56 L 896 12 L 906 66 L 914 50 
               L 935 50 
               L 950 38 L 965 50 
               L 1040 50 
               C 1070 30, 1090 70, 1120 50 
               L 1200 50" 
            fill="none" 
            stroke="url(#primaryGrad)" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            class="animated-ecg"
            filter="url(#glow)"/>

      <!-- Secondary Echo Wave for Depth -->
      <path d="M 0 50 
               L 120 50 
               L 135 44 L 145 50 
               L 160 50 
               L 168 56 L 176 10 L 186 68 L 194 50 
               L 215 50 
               L 230 38 L 245 50 
               L 340 50 
               L 355 44 L 365 50 
               L 380 50 
               L 388 56 L 396 6 L 406 72 L 414 50 
               L 435 50 
               L 450 38 L 465 50 
               L 560 50 
               C 600 20, 630 80, 670 50 
               C 710 20, 740 80, 780 50 
               L 840 50 
               L 855 44 L 865 50 
               L 880 50 
               L 888 56 L 896 12 L 906 66 L 914 50 
               L 935 50 
               L 950 38 L 965 50 
               L 1040 50 
               C 1070 30, 1090 70, 1120 50 
               L 1200 50" 
            fill="none" 
            stroke="#38ef7d" 
            stroke-width="1.2" 
            opacity="0.5"
            stroke-linecap="round" 
            stroke-linejoin="round"
            class="animated-ecg"
            style="animation-delay: -3s;"/>
    </g>

    <!-- Bottom Footer Metrics Bar -->
    <g transform="translate(60, 390)">
      <text x="0" y="0" fill="#58739f" class="code-font" font-size="11">● 100+ CURATED RESOURCES</text>
      <text x="210" y="0" fill="#58739f" class="code-font" font-size="11">● OPEN SOURCE &amp; ENTERPRISE CAC</text>
      <text x="490" y="0" fill="#58739f" class="code-font" font-size="11">● REAL-TIME BENCHMARKS &amp; DATASETS</text>
      <text x="820" y="0" fill="#38ef7d" class="code-font" font-size="11" font-weight="bold">● CONTINUOUSLY UPDATED</text>
    </g>

    <!-- Top & Bottom Glowing Border Frame -->
    <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
  </g>
</svg>
