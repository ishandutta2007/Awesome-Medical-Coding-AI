<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" style="background:#070b14;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#08101e" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38ef7d">
        <animate attributeName="stop-color" values="#38ef7d;#11998e;#38ef7d" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#38ef7d;#00f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#00f2fe" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ekgRun {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      .floating-title { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
      .ekg-line { stroke-dasharray: 1200; animation: ekgRun 3.5s linear infinite; }
      .pulse-beacon { animation: blinkGlow 2s ease-in-out infinite; }
      .radar-arm { transform-origin: 1080px 100px; animation: radarSweep 10s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="190" r="180" fill="#00f2fe" fill-opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="160;190;160" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="190" r="220" fill="#38ef7d" fill-opacity="0.07" filter="url(#glow)">
    <animate attributeName="r" values="200;230;200" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Medical Cross / Plus Accents -->
  <g fill="#00f2fe" opacity="0.3" class="pulse-beacon">
    <path d="M 80 70 h 6 v 18 h -6 z M 74 76 h 18 v 6 h -18 z" />
    <path d="M 1120 290 h 6 v 18 h -6 z M 1114 296 h 18 v 6 h -18 z" />
    <path d="M 620 45 h 4 v 12 h -4 z M 616 49 h 12 v 4 h -12 z" opacity="0.5" />
    <path d="M 320 330 h 4 v 12 h -4 z M 316 334 h 12 v 4 h -12 z" opacity="0.4" />
  </g>

  <!-- Dynamic EKG / Heartbeat Waveform Line -->
  <path d="M 0 290 L 250 290 L 270 290 L 285 260 L 300 325 L 315 240 L 330 310 L 345 285 L 365 290 L 600 290 L 620 290 L 635 255 L 650 330 L 665 235 L 680 315 L 695 285 L 715 290 L 950 290 L 970 290 L 985 260 L 1000 325 L 1015 240 L 1030 310 L 1045 285 L 1065 290 L 1200 290" 
        fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.8" class="ekg-line" filter="url(#laserGlow)" />

  <path d="M 0 290 L 1200 290" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />

  <!-- Animated Radar / Scanner Target (Right Corner) -->
  <g opacity="0.4">
    <circle cx="1080" cy="95" r="55" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="1080" cy="95" r="35" fill="none" stroke="#38ef7d" stroke-width="0.8" />
    <circle cx="1080" cy="95" r="15" fill="none" stroke="#00f2fe" stroke-width="1" />
    <line x1="1080" y1="35" x2="1080" y2="155" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.6" />
    <line x1="1020" y1="95" x2="1140" y2="95" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.6" />
    <line x1="1080" y1="95" x2="1130" y2="60" stroke="#38ef7d" stroke-width="2" class="radar-arm" filter="url(#glow)" />
  </g>

  <!-- Hero Content Center -->
  <g class="floating-title">
    <!-- Top Pill Badge -->
    <g transform="translate(425, 48)">
      <rect x="0" y="0" width="350" height="32" rx="16" fill="url(#badgeGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.8" filter="url(#glow)" />
      <circle cx="18" cy="16" r="5" fill="#38ef7d">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-size="44" font-weight="900" fill="url(#cyanPurple)" filter="url(#glow)" letter-spacing="0.5">
      Awesome-Medical-Coding-AI
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" text-anchor="middle" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.4">
      Autonomous Medical Coding &bull; Clinical NLP &bull; ICD-10-CM / PCS &bull; CPT &bull; RCM Intelligence
    </text>
  </g>

  <!-- Feature Pills / Badges in Row -->
  <g transform="translate(130, 205)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="8" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="82" y="23" fill="#38bdf8" font-size="12.5" font-weight="700" text-anchor="middle">&#x1F9E0; Autonomous AI</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="175" height="36" rx="8" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
      <text x="87" y="23" fill="#34d399" font-size="12.5" font-weight="700" text-anchor="middle">&#x1F3E5; ICD-10 / CPT / DRG</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(370, 0)">
      <rect width="185" height="36" rx="8" fill="url(#badgeGrad)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.6" />
      <text x="92" y="23" fill="#a78bfa" font-size="12.5" font-weight="700" text-anchor="middle">&#x1F4AC; Clinical NLP &amp; LLMs</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(570, 0)">
      <rect width="180" height="36" rx="8" fill="url(#badgeGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.6" />
      <text x="90" y="23" fill="#f472b6" font-size="12.5" font-weight="700" text-anchor="middle">&#x2696;&#xFE0F; Auditable &amp; HITL</text>
    </g>

    <!-- Pill 5 -->
    <g transform="translate(765, 0)">
      <rect width="175" height="36" rx="8" fill="url(#badgeGrad)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6" />
      <text x="87" y="23" fill="#fbbf24" font-size="12.5" font-weight="700" text-anchor="middle">&#x1F4B8; SaaS &amp; Open Source</text>
    </g>
  </g>

  <!-- Bottom Dynamic Status Indicator Bar -->
  <g transform="translate(100, 345)">
    <circle cx="10" cy="5" r="4" fill="#38ef7d" class="pulse-beacon" />
    <text x="24" y="9" fill="#64748b" font-size="12" font-weight="600" letter-spacing="0.5">ACTIVE COMMUNITY CURATION &bull; UPDATED FOR 2026 &bull; OPEN ARCHITECTURES &amp; COMMERCIAL ECOSYSTEMS</text>
  </g>
</svg>
